<!DOCTYPE html>
<html><head><title>My EA Trade App</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;background:#0e0e0e;color:white;text-align:center;padding:20px}.card{background:#1c1c1c;padding:20px;border-radius:15px;margin:20px auto;max-width:400px}button{padding:15px 30px;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin:10px;width:80%}.start{background:#00ff88;font-weight:bold}.stop{background:#ff4444;color:white;font-weight:bold}</style>
</head><body><h1>My EA Trade App</h1><div class="card"><h2>Balance: $<span id="balance">1000</span></h2><p>Status: <b><span id="status">Stopped</span></b></p><p>Signal: <span id="signal">-</span></p></div><button class="start" onclick="startBot()">START BOT</button><button class="stop" onclick="stopBot()">STOP BOT</button>
<script>function startBot(){fetch('/start',{method:'POST'}).then(()=>update());alert('Bot Started!')}function stopBot(){fetch('/stop',{method:'POST'}).then(()=>update());alert('Bot Stopped!')}function update(){fetch('/status').then(r=>r.json()).then(data=>{document.getElementById('balance').innerText=data.balance;document.getElementById('status').innerText=data.running?'RUNNING':'STOPPED';document.getElementById('signal').innerText=data.last_signal})}setInterval(update,3000);update()</script></body></html>
